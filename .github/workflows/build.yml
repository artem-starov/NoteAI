name: Build NoteAI (APK and Google Play bundle)

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'apk = release for friends on GitHub; play = signed bundle (AAB) for Google Play'
        type: choice
        options: [apk, play]
        default: apk
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TARGET: ${{ github.event.inputs.target || 'apk' }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create Capacitor project
        run: |
          mkdir app && cd app
          cat > package.json <<'EOF'
          {
            "name": "noteai-app",
            "version": "1.5.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^8.0.0",
              "@capacitor/app": "^8.0.0",
              "@capacitor/browser": "^8.0.0",
              "@capacitor/cli": "^8.0.0",
              "@capacitor/core": "^8.0.0"
            }
          }
          EOF
          cat > config.apk.json <<'EOF'
          {
            "appId": "com.noteai.app",
            "appName": "NoteAI",
            "webDir": "www",
            "server": {
              "url": "https://nouteai-prodject.web.app",
              "androidScheme": "https",
              "allowNavigation": ["nouteai-prodject.web.app", "*.firebaseapp.com", "*.googleapis.com"]
            },
            "android": { "backgroundColor": "#070b14" }
          }
          EOF
          cat > config.play.json <<'EOF'
          {
            "appId": "com.noteai.app",
            "appName": "NoteAI",
            "webDir": "www",
            "server": { "androidScheme": "https" },
            "android": { "backgroundColor": "#070b14", "appendUserAgent": "NoteAIPlay" }
          }
          EOF
          cp config.$TARGET.json capacitor.config.json
          mkdir www
          cat > www/index.html <<'EOF'
          <!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NoteAI</title></head><body style="background:#070b14;color:#e8f1ff;font-family:sans-serif;text-align:center;padding-top:30vh">NoteAI</body></html>
          EOF
          if [ "$TARGET" = "play" ]; then
            for f in index.html manifest.json icon-192.png icon-512.png privacy.html delete-account.html; do
              curl -fsSL "https://nouteai-prodject.web.app/$f" -o "www/$f"
            done
          fi
          npm install
          npx cap add android

      - name: Customize app (icon, alarm sound, permissions)
        working-directory: app
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          pip install pillow
          python3 - <<'PY'
          import math, struct, wave, os, shutil, re
          from PIL import Image, ImageDraw, ImageFilter

          # ---- alarm sound (about 20 seconds)
          rate = 22050
          buf = bytearray()
          def bell(f, d, vol=0.5):
              n = int(rate * d)
              for i in range(n):
                  t = i / rate
                  env = min(1.0, i / 300) * math.exp(-3.2 * t / d)
                  v = (math.sin(2 * math.pi * f * t) + 0.35 * math.sin(4 * math.pi * f * t) + 0.12 * math.sin(6 * math.pi * f * t)) / 1.47
                  buf.extend(struct.pack('<h', int(32767 * vol * env * v)))
          def pause(d):
              buf.extend(b'\x00\x00' * int(rate * d))
          for _ in range(6):
              for f in (523.25, 659.25, 783.99, 1046.5):
                  bell(f, 0.6)
              pause(1.4)
          raw = 'android/app/src/main/res/raw'
          os.makedirs(raw, exist_ok=True)
          w = wave.open(raw + '/alarm.wav', 'wb')
          w.setnchannels(1); w.setsampwidth(2); w.setframerate(rate)
          w.writeframes(bytes(buf)); w.close()

          # ---- icon
          S = 1024
          bg = Image.new('RGB', (S, S), (7, 11, 20))
          grad = Image.new('RGB', (S, S))
          px = grad.load()
          for y in range(S):
              for x in range(S):
                  t = (x + y) / (2 * S - 2)
                  px[x, y] = (int(25 + 230 * t), int(181 - 43 * t), int(255 - 224 * t))
          mask = Image.new('L', (S, S), 0)
          d = ImageDraw.Draw(mask)
          u = S / 192 * 0.8
          o = S * 0.1
          P = lambda x, y: (o + x * u, o + y * u)
          d.rounded_rectangle([*P(36, 28), *P(156, 164)], radius=int(14 * u), outline=255, width=int(10 * u))
          for yy in (70, 96, 122):
              d.line([*P(60, yy), *P(132, yy)], fill=255, width=int(7 * u))
          glow = mask.filter(ImageFilter.GaussianBlur(S * 0.02)).point(lambda v: int(v * 0.55))
          base = Image.composite(grad, bg, mask)
          base = Image.composite(grad, Image.composite(grad, bg, glow), mask)
          res = 'android/app/src/main/res'
          for k, size in {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}.items():
              im = base.resize((size, size), Image.LANCZOS)
              for name in ('ic_launcher.png', 'ic_launcher_round.png'):
                  im.save(res + '/mipmap-' + k + '/' + name)
          shutil.rmtree(res + '/mipmap-anydpi-v26', ignore_errors=True)

          # ---- app version (used by the in-app update check)
          g = 'android/app/build.gradle'
          t = open(g, encoding='utf-8').read()
          run = os.environ.get('RUN_NUMBER', '1')
          t2 = re.sub(r'versionCode\s+\d+', 'versionCode ' + run, t)
          t2 = re.sub(r'versionName\s+"[^"]*"', 'versionName "1.' + run + '"', t2)
          open(g, 'w', encoding='utf-8').write(t2)
          print('versionCode set to ' + run if t2 != t else 'WARNING: versionCode was not changed')

          # ---- permissions for exact alarms, notifications and vibration
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          play = os.environ.get('TARGET') == 'play'
          perms = ['POST_NOTIFICATIONS', 'VIBRATE', 'WAKE_LOCK', 'RECEIVE_BOOT_COMPLETED', 'USE_EXACT_ALARM', 'USE_FULL_SCREEN_INTENT', 'FOREGROUND_SERVICE', 'FOREGROUND_SERVICE_MEDIA_PLAYBACK']
          if play:
              perms.append('SCHEDULE_EXACT_ALARM:32')
          else:
              perms += ['SCHEDULE_EXACT_ALARM', 'SYSTEM_ALERT_WINDOW', 'REQUEST_IGNORE_BATTERY_OPTIMIZATIONS', 'REQUEST_INSTALL_PACKAGES']
          add = ''
          for x in perms:
              name, _, mx = x.partition(':')
              if 'permission.%s"' % name not in s:
                  add += '    <uses-permission android:name="android.permission.%s"%s />\n' % (name, (' android:maxSdkVersion="%s"' % mx) if mx else '')
          s = s.replace('</manifest>', add + '</manifest>')
          open(p, 'w', encoding='utf-8').write(s)

          # ---- release signing for the Google Play bundle
          if play:
              t = open(g, encoding='utf-8').read()
              sign = ("    signingConfigs {\n        release {\n"
                      "            storeFile file(System.getenv('UPLOAD_KS'))\n"
                      "            storePassword System.getenv('UPLOAD_STORE_PASSWORD')\n"
                      "            keyAlias System.getenv('UPLOAD_KEY_ALIAS')\n"
                      "            keyPassword System.getenv('UPLOAD_KEY_PASSWORD')\n"
                      "        }\n    }\n")
              old = "    buildTypes {\n        release {\n"
              assert old in t, 'buildTypes block not found'
              t = t.replace(old, sign + old + "            signingConfig signingConfigs.release\n")
              open(g, 'w', encoding='utf-8').write(t)
              print('release signing configured')
          PY

      - name: Add native alarm (full-screen alarm with vibration)
        working-directory: app
        run: |
          python3 - <<'PY'
          import re, glob, os

          act = glob.glob('android/app/src/main/java/**/MainActivity.java', recursive=True)[0]
          pkg = re.search(r'package\s+([\w.]+);', open(act, encoding='utf-8').read()).group(1)
          out = os.path.dirname(act)

          FILES = {}

          FILES['MainActivity'] = r'''package %PKG%;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(AlarmPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          '''

          FILES['AlarmStore'] = r'''package %PKG%;

          import android.app.AlarmManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class AlarmStore {
              static SharedPreferences prefs(Context c) {
                  return c.getSharedPreferences("noteai_alarms", Context.MODE_PRIVATE);
              }

              static JSONArray load(Context c) {
                  try {
                      return new JSONArray(prefs(c).getString("list", "[]"));
                  } catch (Exception e) {
                      return new JSONArray();
                  }
              }

              static void save(Context c, JSONArray a) {
                  prefs(c).edit().putString("list", a.toString()).apply();
              }

              static PendingIntent pending(Context c, JSONObject o) {
                  Intent i = new Intent(c, AlarmReceiver.class);
                  i.putExtra("id", o.optInt("id"));
                  i.putExtra("text", o.optString("text"));
                  i.putExtra("title", o.optString("title"));
                  i.putExtra("stop", o.optString("stop"));
                  i.putExtra("snooze", o.optString("snooze"));
                  i.putExtra("silent", o.optInt("silent"));
                  return PendingIntent.getBroadcast(c, o.optInt("id"), i, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              }

              static void schedule(Context c, JSONObject o) {
                  AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
                  Intent open = new Intent(c, MainActivity.class);
                  PendingIntent show = PendingIntent.getActivity(c, 0, open, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  am.setAlarmClock(new AlarmManager.AlarmClockInfo(o.optLong("at"), show), pending(c, o));
              }

              static void cancel(Context c, JSONObject o) {
                  AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
                  am.cancel(pending(c, o));
              }

              static void add(Context c, JSONObject o) {
                  try {
                      JSONArray old = load(c);
                      JSONArray n = new JSONArray();
                      for (int k = 0; k < old.length(); k++) {
                          JSONObject x = old.getJSONObject(k);
                          if (x.optInt("id") != o.optInt("id")) n.put(x);
                      }
                      o.put("keep", true);
                      n.put(o);
                      save(c, n);
                      schedule(c, o);
                  } catch (Exception e) {
                  }
              }

              static void syncList(Context c, JSONArray fresh) {
                  try {
                      JSONArray old = load(c);
                      JSONArray n = new JSONArray();
                      for (int k = 0; k < old.length(); k++) {
                          JSONObject x = old.getJSONObject(k);
                          if (x.optBoolean("keep")) {
                              n.put(x);
                          } else {
                              cancel(c, x);
                          }
                      }
                      for (int k = 0; k < fresh.length(); k++) {
                          JSONObject o = fresh.getJSONObject(k);
                          schedule(c, o);
                          n.put(o);
                      }
                      save(c, n);
                  } catch (Exception e) {
                  }
              }

              static void remove(Context c, int id) {
                  try {
                      JSONArray old = load(c);
                      JSONArray n = new JSONArray();
                      for (int k = 0; k < old.length(); k++) {
                          JSONObject x = old.getJSONObject(k);
                          if (x.optInt("id") != id) n.put(x);
                      }
                      save(c, n);
                  } catch (Exception e) {
                  }
              }

              static void restore(Context c) {
                  try {
                      JSONArray a = load(c);
                      long now = System.currentTimeMillis();
                      for (int k = 0; k < a.length(); k++) {
                          JSONObject x = a.getJSONObject(k);
                          if (x.optLong("at") > now) schedule(c, x);
                      }
                  } catch (Exception e) {
                  }
              }
          }
          '''

          FILES['BootReceiver'] = r'''package %PKG%;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;

          public class BootReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context c, Intent i) {
                  AlarmStore.restore(c);
              }
          }
          '''

          FILES['AlarmReceiver'] = r'''package %PKG%;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;

          public class AlarmReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context c, Intent in) {
                  AlarmStore.remove(c, in.getIntExtra("id", 0));
                  Intent s = new Intent(c, AlarmService.class);
                  s.putExtras(in);
                  try {
                      if (Build.VERSION.SDK_INT >= 26) {
                          c.startForegroundService(s);
                      } else {
                          c.startService(s);
                      }
                  } catch (Exception e) {
                      try {
                          Intent a = new Intent(c, AlarmActivity.class);
                          a.putExtras(in);
                          a.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          c.startActivity(a);
                      } catch (Exception e2) {
                      }
                  }
              }
          }
          '''

          FILES['AlarmService'] = r'''package %PKG%;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.media.AudioAttributes;
          import android.media.MediaPlayer;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.os.PowerManager;
          import android.os.VibrationEffect;
          import android.os.Vibrator;
          import org.json.JSONObject;

          public class AlarmService extends Service {
              static final String ACT_STOP = "noteai.STOP";
              static final String ACT_SNOOZE = "noteai.SNOOZE";

              private MediaPlayer mp;
              private Vibrator vib;
              private PowerManager.WakeLock wl;
              private final Handler h = new Handler(Looper.getMainLooper());
              private float vol = 0.25f;
              private boolean running = false;
              private int id;
              private String text;
              private String title;
              private String stop;
              private String snooze;
              private int silent;

              private final Runnable ramp = new Runnable() {
                  @Override
                  public void run() {
                      if (mp == null) return;
                      vol = Math.min(1f, vol + 0.1f);
                      try {
                          mp.setVolume(vol, vol);
                      } catch (Exception e) {
                      }
                      if (vol < 1f) h.postDelayed(this, 1500);
                  }
              };

              private final Runnable autoStop = new Runnable() {
                  @Override
                  public void run() {
                      finishAlarm();
                  }
              };

              @Override
              public IBinder onBind(Intent i) {
                  return null;
              }

              private Intent withData(Intent i) {
                  i.putExtra("id", id);
                  i.putExtra("text", text);
                  i.putExtra("title", title);
                  i.putExtra("stop", stop);
                  i.putExtra("snooze", snooze);
                  i.putExtra("silent", silent);
                  return i;
              }

              private Intent activityIntent() {
                  Intent a = withData(new Intent(this, AlarmActivity.class));
                  a.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  return a;
              }

              private Notification buildNotification() {
                  NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                  String ch = "noteai_alarm_svc";
                  if (Build.VERSION.SDK_INT >= 26 && nm.getNotificationChannel(ch) == null) {
                      NotificationChannel nc = new NotificationChannel(ch, "NoteAI alarm", NotificationManager.IMPORTANCE_HIGH);
                      nc.setSound(null, null);
                      nc.enableVibration(false);
                      nc.setLockscreenVisibility(Notification.VISIBILITY_PUBLIC);
                      nm.createNotificationChannel(nc);
                  }
                  int fl = PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE;
                  PendingIntent fs = PendingIntent.getActivity(this, 1, activityIntent(), fl);
                  PendingIntent stopPi = PendingIntent.getService(this, 2, withData(new Intent(this, AlarmService.class).setAction(ACT_STOP)), fl);
                  PendingIntent snzPi = PendingIntent.getService(this, 3, withData(new Intent(this, AlarmService.class).setAction(ACT_SNOOZE)), fl);
                  Notification.Builder b = Build.VERSION.SDK_INT >= 26 ? new Notification.Builder(this, ch) : new Notification.Builder(this);
                  b.setSmallIcon(android.R.drawable.ic_lock_idle_alarm)
                          .setContentTitle(title)
                          .setContentText(text)
                          .setCategory(Notification.CATEGORY_ALARM)
                          .setOngoing(true)
                          .setFullScreenIntent(fs, true)
                          .setContentIntent(fs)
                          .addAction(0, stop, stopPi)
                          .addAction(0, snooze, snzPi);
                  if (Build.VERSION.SDK_INT < 26) b.setPriority(Notification.PRIORITY_MAX);
                  return b.build();
              }

              @Override
              public int onStartCommand(Intent in, int flags, int startId) {
                  if (in == null) {
                      stopSelf();
                      return START_NOT_STICKY;
                  }
                  String act = in.getAction();
                  if (ACT_STOP.equals(act)) {
                      finishAlarm();
                      return START_NOT_STICKY;
                  }
                  if (ACT_SNOOZE.equals(act)) {
                      snoozeFrom(in);
                      finishAlarm();
                      return START_NOT_STICKY;
                  }

                  id = in.getIntExtra("id", 0);
                  text = in.getStringExtra("text");
                  title = in.getStringExtra("title");
                  stop = in.getStringExtra("stop");
                  snooze = in.getStringExtra("snooze");
                  silent = in.getIntExtra("silent", 0);
                  if (title == null) title = "!";
                  if (text == null) text = "";
                  if (stop == null) stop = "OK";
                  if (snooze == null) snooze = "+5";

                  int nid = id == 0 ? 1 : id;
                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(nid, buildNotification(), ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK);
                  } else {
                      startForeground(nid, buildNotification());
                  }
                  if (!running) {
                      running = true;
                      wake();
                      if (silent == 0) startSound();
                      startVibrate();
                      h.postDelayed(autoStop, 300000L);
                  }
                  try {
                      startActivity(activityIntent());
                  } catch (Exception e) {
                  }
                  return START_NOT_STICKY;
              }

              private void wake() {
                  try {
                      PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                      wl = pm.newWakeLock(PowerManager.FULL_WAKE_LOCK | PowerManager.ACQUIRE_CAUSES_WAKEUP | PowerManager.ON_AFTER_RELEASE, "noteai:alarm");
                      wl.acquire(60000L);
                  } catch (Exception e) {
                  }
              }

              private void startSound() {
                  try {
                      mp = new MediaPlayer();
                      mp.setAudioAttributes(new AudioAttributes.Builder()
                              .setUsage(AudioAttributes.USAGE_ALARM)
                              .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                              .build());
                      mp.setDataSource(getApplicationContext(), Uri.parse("android.resource://" + getPackageName() + "/raw/alarm"));
                      mp.setLooping(true);
                      mp.setVolume(vol, vol);
                      mp.prepare();
                      mp.start();
                      h.postDelayed(ramp, 1500);
                  } catch (Exception e) {
                  }
              }

              private void startVibrate() {
                  try {
                      vib = (Vibrator) getSystemService(Context.VIBRATOR_SERVICE);
                      long[] p = new long[]{0, 500, 400, 500, 400, 500, 1500};
                      if (vib != null) {
                          if (Build.VERSION.SDK_INT >= 26) {
                              vib.vibrate(VibrationEffect.createWaveform(p, 0),
                                      new AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_ALARM).build());
                          } else {
                              vib.vibrate(p, 0);
                          }
                      }
                  } catch (Exception e) {
                  }
              }

              private void snoozeFrom(Intent in) {
                  try {
                      JSONObject o = new JSONObject();
                      o.put("id", in.getIntExtra("id", 0));
                      o.put("at", System.currentTimeMillis() + 300000L);
                      o.put("text", in.getStringExtra("text"));
                      o.put("title", in.getStringExtra("title"));
                      o.put("stop", in.getStringExtra("stop"));
                      o.put("snooze", in.getStringExtra("snooze"));
                      o.put("silent", in.getIntExtra("silent", 0));
                      AlarmStore.add(this, o);
                  } catch (Exception e) {
                  }
              }

              private void cleanup() {
                  running = false;
                  h.removeCallbacksAndMessages(null);
                  try {
                      if (mp != null) {
                          mp.stop();
                          mp.release();
                      }
                  } catch (Exception e) {
                  }
                  mp = null;
                  try {
                      if (vib != null) vib.cancel();
                  } catch (Exception e) {
                  }
                  try {
                      if (wl != null && wl.isHeld()) wl.release();
                  } catch (Exception e) {
                  }
              }

              private void finishAlarm() {
                  cleanup();
                  if (AlarmActivity.current != null) AlarmActivity.current.finish();
                  stopForeground(true);
                  stopSelf();
              }

              @Override
              public void onDestroy() {
                  cleanup();
                  super.onDestroy();
              }
          }
          '''

          FILES['AlarmActivity'] = r'''package %PKG%;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import java.text.DateFormat;
          import java.util.Date;

          public class AlarmActivity extends Activity {
              static AlarmActivity current;
              private int id;
              private String text;
              private String title;
              private String stop;
              private String snooze;
              private int silent;

              private int dp(int v) {
                  return (int) (v * getResources().getDisplayMetrics().density);
              }

              private String nz(String s, String d) {
                  return (s == null || s.length() == 0) ? d : s;
              }

              private TextView label(String t, int sp, String color, boolean bold) {
                  TextView v = new TextView(this);
                  v.setText(t);
                  v.setTextSize(sp);
                  v.setTextColor(Color.parseColor(color));
                  v.setGravity(Gravity.CENTER);
                  if (bold) v.setTypeface(Typeface.DEFAULT_BOLD);
                  return v;
              }

              private Button button(String t, String bg, String fg) {
                  Button b = new Button(this);
                  b.setText(t);
                  b.setTextSize(18);
                  b.setAllCaps(false);
                  b.setTextColor(Color.parseColor(fg));
                  b.setBackgroundColor(Color.parseColor(bg));
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, dp(64));
                  lp.topMargin = dp(16);
                  b.setLayoutParams(lp);
                  return b;
              }

              private Intent svc(String action) {
                  Intent s = new Intent(this, AlarmService.class);
                  s.setAction(action);
                  s.putExtra("id", id);
                  s.putExtra("text", text);
                  s.putExtra("title", title);
                  s.putExtra("stop", stop);
                  s.putExtra("snooze", snooze);
                  s.putExtra("silent", silent);
                  return s;
              }

              @Override
              protected void onCreate(Bundle s) {
                  super.onCreate(s);
                  current = this;
                  if (Build.VERSION.SDK_INT >= 27) {
                      setShowWhenLocked(true);
                      setTurnScreenOn(true);
                  }
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON
                          | WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED
                          | WindowManager.LayoutParams.FLAG_TURN_SCREEN_ON
                          | WindowManager.LayoutParams.FLAG_DISMISS_KEYGUARD);

                  id = getIntent().getIntExtra("id", 0);
                  text = nz(getIntent().getStringExtra("text"), "");
                  title = nz(getIntent().getStringExtra("title"), "!");
                  stop = nz(getIntent().getStringExtra("stop"), "OK");
                  snooze = nz(getIntent().getStringExtra("snooze"), "+5");
                  silent = getIntent().getIntExtra("silent", 0);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setGravity(Gravity.CENTER);
                  root.setBackgroundColor(Color.parseColor("#070b14"));
                  root.setPadding(dp(24), dp(24), dp(24), dp(24));
                  root.addView(label("\u23F0", 72, "#ffffff", false));
                  root.addView(label(title, 40, "#ff8a1f", true));
                  root.addView(label(text, 22, "#e8f1ff", false));
                  root.addView(label(DateFormat.getTimeInstance(DateFormat.SHORT).format(new Date()), 16, "#7f8fb0", false));
                  Button stopBtn = button(stop, "#19b5ff", "#06101f");
                  Button snoozeBtn = button(snooze, "#131c30", "#e8f1ff");
                  root.addView(stopBtn);
                  root.addView(snoozeBtn);
                  setContentView(root);

                  stopBtn.setOnClickListener(v -> {
                      startService(svc(AlarmService.ACT_STOP));
                      finish();
                  });
                  snoozeBtn.setOnClickListener(v -> {
                      startService(svc(AlarmService.ACT_SNOOZE));
                      finish();
                  });
              }

              @Override
              protected void onDestroy() {
                  if (current == this) current = null;
                  super.onDestroy();
              }
          }
          '''

          FILES['AlarmPlugin'] = r'''package %PKG%;

          import android.app.NotificationManager;
          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.PowerManager;
          import android.provider.Settings;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.Permission;
          import com.getcapacitor.annotation.PermissionCallback;
          import android.Manifest;
          import androidx.core.content.FileProvider;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;

          @CapacitorPlugin(name = "NativeAlarm", permissions = {@Permission(strings = {Manifest.permission.POST_NOTIFICATIONS}, alias = "notif")})
          public class AlarmPlugin extends Plugin {
              @PluginMethod
              public void requestNotifications(PluginCall call) {
                  if (Build.VERSION.SDK_INT >= 33) {
                      requestPermissionForAlias("notif", call, "notifDone");
                  } else {
                      call.resolve();
                  }
              }

              @PermissionCallback
              private void notifDone(PluginCall call) {
                  call.resolve();
              }

              @PluginMethod
              public void sync(PluginCall call) {
                  JSArray arr = call.getArray("alarms");
                  if (arr != null) AlarmStore.syncList(getContext(), arr);
                  call.resolve();
              }

              @PluginMethod
              public void add(PluginCall call) {
                  AlarmStore.add(getContext(), call.getData());
                  call.resolve();
              }

              @PluginMethod
              public void status(PluginCall call) {
                  Context c = getContext();
                  JSObject r = new JSObject();
                  r.put("overlay", Settings.canDrawOverlays(c));
                  NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
                  r.put("notifications", nm.areNotificationsEnabled());
                  boolean fs = true;
                  if (Build.VERSION.SDK_INT >= 34) fs = nm.canUseFullScreenIntent();
                  r.put("fullscreen", fs);
                  PowerManager pm = (PowerManager) c.getSystemService(Context.POWER_SERVICE);
                  r.put("battery", Build.VERSION.SDK_INT < 23 || pm.isIgnoringBatteryOptimizations(c.getPackageName()));
                  call.resolve(r);
              }

              @PluginMethod
              public void openSettings(PluginCall call) {
                  String t = call.getString("type", "");
                  Context c = getContext();
                  String pkg = c.getPackageName();
                  Intent i;
                  if ("overlay".equals(t)) {
                      i = new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + pkg));
                  } else if ("fullscreen".equals(t) && Build.VERSION.SDK_INT >= 34) {
                      i = new Intent(Settings.ACTION_MANAGE_APP_USE_FULL_SCREEN_INTENT, Uri.parse("package:" + pkg));
                  } else if ("battery".equals(t)) {
                      i = new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS, Uri.parse("package:" + pkg));
                  } else {
                      i = new Intent(Settings.ACTION_APP_NOTIFICATION_SETTINGS);
                      i.putExtra(Settings.EXTRA_APP_PACKAGE, pkg);
                  }
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  try {
                      c.startActivity(i);
                  } catch (Exception e) {
                  }
                  call.resolve();
              }

              private static boolean busy = false;

              @PluginMethod
              public void download(final PluginCall call) {
                  final String url = call.getString("url");
                  if (url == null) {
                      call.reject("no url");
                      return;
                  }
                  call.resolve();
                  if (busy) return;
                  busy = true;
                  new Thread(() -> {
                      try {
                          File dir = new File(getContext().getCacheDir(), "update");
                          dir.mkdirs();
                          File f = new File(dir, "NoteAI.apk");
                          HttpURLConnection c = (HttpURLConnection) new URL(url).openConnection();
                          c.setInstanceFollowRedirects(true);
                          c.setConnectTimeout(15000);
                          c.setReadTimeout(30000);
                          c.connect();
                          if (c.getResponseCode() != 200) throw new Exception("http " + c.getResponseCode());
                          int total = c.getContentLength();
                          InputStream in = c.getInputStream();
                          FileOutputStream out = new FileOutputStream(f);
                          byte[] buf = new byte[32768];
                          long done = 0;
                          int n;
                          int last = -1;
                          while ((n = in.read(buf)) > 0) {
                              out.write(buf, 0, n);
                              done += n;
                              if (total > 0) {
                                  int pct = (int) (done * 100 / total);
                                  if (pct != last) {
                                      last = pct;
                                      JSObject o = new JSObject();
                                      o.put("percent", pct);
                                      notifyListeners("updateProgress", o);
                                  }
                              }
                          }
                          out.close();
                          in.close();
                          notifyListeners("updateReady", new JSObject());
                      } catch (Exception e) {
                          notifyListeners("updateFail", new JSObject());
                      }
                      busy = false;
                  }).start();
              }

              @PluginMethod
              public void install(PluginCall call) {
                  Context c = getContext();
                  JSObject r = new JSObject();
                  File f = new File(new File(c.getCacheDir(), "update"), "NoteAI.apk");
                  if (!f.exists()) {
                      call.reject("no file");
                      return;
                  }
                  if (Build.VERSION.SDK_INT >= 26 && !c.getPackageManager().canRequestPackageInstalls()) {
                      Intent s = new Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES, Uri.parse("package:" + c.getPackageName()));
                      s.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      try {
                          c.startActivity(s);
                      } catch (Exception e) {
                      }
                      r.put("needPerm", true);
                      call.resolve(r);
                      return;
                  }
                  try {
                      Uri u = FileProvider.getUriForFile(c, c.getPackageName() + ".fileprovider", f);
                      Intent i = new Intent(Intent.ACTION_VIEW);
                      i.setDataAndType(u, "application/vnd.android.package-archive");
                      i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                      c.startActivity(i);
                      r.put("needPerm", false);
                      call.resolve(r);
                  } catch (Exception e) {
                      call.reject("install failed");
                  }
              }
          }
          '''

          for name, code in FILES.items():
              open(os.path.join(out, name + '.java'), 'w', encoding='utf-8').write(code.replace('%PKG%', pkg))

          p = 'android/app/src/main/AndroidManifest.xml'
          m = open(p, encoding='utf-8').read()
          extra = '''
                  <receiver android:name="%PKG%.AlarmReceiver" android:exported="false" />
                  <receiver android:name="%PKG%.BootReceiver" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                      </intent-filter>
                  </receiver>
                  <service android:name="%PKG%.AlarmService" android:exported="false" android:foregroundServiceType="mediaPlayback" />
                  <activity android:name="%PKG%.AlarmActivity" android:exported="false" android:excludeFromRecents="true" android:showWhenLocked="true" android:turnScreenOn="true" android:theme="@android:style/Theme.Material.NoActionBar" />
          '''.replace('%PKG%', pkg)
          xml_dir = 'android/app/src/main/res/xml'
          os.makedirs(xml_dir, exist_ok=True)
          open(xml_dir + '/file_paths.xml', 'w', encoding='utf-8').write('<?xml version="1.0" encoding="utf-8"?>\n<paths xmlns:android="http://schemas.android.com/apk/res/android">\n    <external-path name="my_images" path="." />\n    <cache-path name="my_cache_images" path="." />\n</paths>\n')
          if 'fileprovider' not in m:
              extra += '        <provider android:name="androidx.core.content.FileProvider" android:authorities="${applicationId}.fileprovider" android:exported="false" android:grantUriPermissions="true"><meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/file_paths" /></provider>\n'
          if 'AlarmReceiver' not in m:
              m = m.replace('</application>', extra + '    </application>')
          open(p, 'w', encoding='utf-8').write(m)
          print('native alarm files written for package', pkg)
          PY

      - name: Use fixed signing key (so updates install over old versions)
        if: env.TARGET != 'play'
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            mkdir -p ~/.android
            echo "$KS" | base64 -d > ~/.android/debug.keystore
            echo "Fixed signing key installed"
          else
            echo "No DEBUG_KEYSTORE_B64 secret: using a temporary key"
          fi

      - name: Prepare Google Play upload key
        if: env.TARGET == 'play'
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
        run: |
          test -n "$UPLOAD_KEYSTORE_B64" || { echo "Missing secret UPLOAD_KEYSTORE_B64"; exit 1; }
          echo "$UPLOAD_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          echo "UPLOAD_KS=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"

      - name: Build Google Play bundle (AAB)
        if: env.TARGET == 'play'
        working-directory: app
        env:
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        if: env.TARGET == 'play'
        with:
          name: NoteAI-play-aab
          path: app/android/app/build/outputs/bundle/release/app-release.aab

      - name: Build APK
        if: env.TARGET != 'play'
        working-directory: app
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        if: env.TARGET != 'play'
        with:
          name: NoteAI-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare release file
        if: env.TARGET != 'play'
        run: cp app/android/app/build/outputs/apk/debug/app-debug.apk NoteAI.apk

      - uses: softprops/action-gh-release@v2
        if: env.TARGET != 'play'
        with:
          tag_name: build-${{ github.run_number }}
          name: NoteAI build ${{ github.run_number }}
          files: NoteAI.apk
